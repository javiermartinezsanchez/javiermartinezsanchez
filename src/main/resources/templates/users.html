<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	th:replace="~{plantillaDatos::layout(~{::section}, ~{::title})}"><head>
<meta charset="utf-8">
<title th:text="#{usuario.title}">title</title>
</head>
<body>
<section>
	<div class="container">
		<h1 th:text="#{usuario.title} + 's'">Usuarios</h1>
		<br>
		<div class="form-group">
			<span><a th:href="@{/admin/usuario/new}" class="btn btn-primary" th:text="#{usuario.newuser}">Nuevo usuario</a></span>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th th:text="#{registro.nombre}">Nombre</th>
					<th th:text="#{registro.apellido}">Apellidos</th>
					<th th:text="#{usuario.rol}">Perfil</th>
					<th th:text="#{usuario.enabled}">F.Nacimiento</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="usuario : ${users}">
					<td th:text="${usuario.email}">ID</td>
					<td th:text="${usuario.nombre}">ID</td>
					<td th:text="${usuario.apellidos}">ID</td>
					<td ><label th:each="role : ${usuario.roles}" th:text="${role.nombre} + ' ' ">role</label></td>
					
					<td th:text="${usuario.enabled} ? #{usuario.enabled} : #{usuario.disabled}"> </td>
					
					<td><a th:href="@{/admin/usuario/{id}(id=${usuario.id})}" class="btn btn-primary" th:text="#{command.modificar}">Modificar</a>
					<a th:href="@{/admin/usuario/delete/{id}(id=${usuario.id})}" class="btn btn-danger" th:text="#{command.borrar}">Borrar</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</section>
</body>
</html>
