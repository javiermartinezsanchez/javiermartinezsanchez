<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
th:fragment="layout(content,title)">
<head >
<meta charset="UTF-8">
<title th:replace="${title}">Insert title here</title>
   <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" />
    <script th:src="@{/webjars/bootstrap/{version}/js/bootstrap.min.js(version=${@webjarsConfig.bootstrap})}"></script>
    <script th:src="@{/webjars/bootstrap/{version}/js/bootstrap.bundle.min.js(version=${@webjarsConfig.bootstrap})}"></script>

</head>
<body>
<div th:replace="~{fragments/header.html :: nav}"></div>
<div th:replace="${content}"></div>
<div th:insert="~{fragments/navegacion.html :: paginacion}"></div>
<div th:replace="~{fragments/footer.html :: footer}"></div>
</body>
</html>
