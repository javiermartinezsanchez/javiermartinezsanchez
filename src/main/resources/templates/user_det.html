<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
 th:replace="~{plantilla::layout(~{::section})}">
<head>
<meta charset="utf-8">
<title>Registro de usuarios</title>

<body>

<section>
	<div class="container">
		<div class="row">
			<div class="col-md-4 col-md-offset-3">
				<h1 th:text="#{usuario.title}">Usuario</h1>
				<form th:action="@{/admin/usuario}" method="post" th:object="${usuario}">
					<input id="id" type="hidden" th:field="*{id}">
					<div class="form-group">
						<label class="control-label" for="nombre" th:text="#{registro.nombre} + ':'"> : </label> <input
							id="nombre" type="text" class="form-control" th:field="*{nombre}"
							required autofocus="autofocus">
					</div>

					<div class="form-group">
						<label class="control-label" for="apellido" th:text="#{registro.apellido} + ':'"></label> <input
							id="apellido" class="form-control" th:field="*{apellidos}"
							required autofocus="autofocus">
					</div>

					<div class="form-group">
						<label class="control-label" for="email">Email : </label> <input
							id="email" type="email" class="form-control" th:field="*{email}"
							required autofocus="autofocus">
					</div>

					<div th:if="${usuario.id == 0}" class="form-group">
						<label class="control-label" for="password">Password : </label> <input
							type="password" id="password" class="form-control" th:field="*{password}"
							required autofocus="autofocus">
					</div>
					<div th:unless="${usuario.id == 0 } or ${usuario.id == '' }" class="form-group">
						<input type="hidden" id="password" th:field="*{password}">
					</div>
					<div class="form-group">
						<label class="control-label" for="role" th:text="#{usuario.rol} + ' :'">Perfiles : </label>
						<label th:each="role : ${usuario.roles}" th:text="${role.nombre} + ' ' ">role></label>
					<select  id="role" name="role" multiple>
    					<option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.nombre}">
    					</option>
					</select>
					</div>
					
					<div class="form-group">
						<label class="control-label" for="enabled" th:text="#{usuario.enabled} + ':'">active : </label> 
						<input type="checkbox" name="enabled" id="enabled" autofocus="autofocus" th:checked="*{enabled}" />
						
					</div>
					<div class="form-group">
						<button type="submit" class="btn btn-success" th:text="#{registro.registro}">Registrar</button>
						<a th:href="@{/admin/usuario}" class="btn btn-danger" th:text="#{command.cancelar}">Cancelar</a>
					</div>
				</form>

			</div>
		</div>
	</div>
</section>
</body>
</html>
