<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	th:replace="~{ plantillaDatos :: layout(~{::section}, ~{::title})}"
	>
<head>
<meta charset="utf-8">
<title th:text="#{drinksize.title}">drinksize.title</title>
</head>
<body>
<section>
	<div class="container">
		<h1 th:text="#{drinksize.title}" >drinksize.title</h1>
		<br>
		<div class="form-group">
			<span><a th:href="@{${pageUrlPrefix} + '/new'}" class="btn btn-primary" th:text="#{command.nuevo} + ' ' +  #{drinksize.title}">Nuevo</a></span>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th th:text="#{registro.nombre}">Nombre</th>
				<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="drinkS : ${listado}">
					<td th:text="${drinkS.nombre}">ID</td>
					<td><a th:href="@{${pageUrlPrefix} + '/' + ${drinkS.id}}" class="btn btn-primary" th:text="#{command.modificar}">Modificar</a>
					<a th:href="@{${pageUrlPrefix} + '/delete/' + ${drinkS.id}}" class="btn btn-danger" th:text="#{command.borrar}">Borrar</a></td>
				</tr>
			</tbody>
		</table>
	</div>	
</section>
</body>
</html>
