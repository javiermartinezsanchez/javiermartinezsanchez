<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	th:replace="~{ plantillaDatos :: layout(~{::section}, ~{::title})}"
	>
<head>
<meta charset="utf-8">
<title th:text="#{contenido.title}">Contenido</title>
</head>
<body>
<section>
	<div class="container">
		<h1 th:text="#{contenido.title} + 's'" >Contenidos</h1>
		<br>
		<div class="form-group">
			<span><a th:href="@{${pageUrlPrefix} + '/new'}" class="btn btn-primary" th:text="#{command.nuevo} + ' ' +  #{contenido.title}">Nuevo</a></span>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th th:text="#{contenido.titulo}">Título</th>
					<th th:text="#{contenido.tipo}">Tipo contenido</th>
					<th th:text="#{director.title}">Director</th>
					<th th:text="#{actor.title}">actor</th>
					<th th:text="#{contenido.productora}">Productora</th>
					<th th:text="#{contenido.fechaEstreno}">Año estreno</th>
					<th th:text="#{genero.title}">Temática</th>
					<th th:text="#{contenido.caratula}">Carátula</th>
					<th th:text="#{contenido.url}">Carátula</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="contenido : ${contenidos}">
					<td th:text="${contenido.titulo}">ID</td>
					<td >ID</td>
					<td >ID</td>
					<td >ID</td>
					<td >ID</td>
					<td >ID</td>
					<td >CARATULA</td>
					<td><a th:href="@{${pageUrlPrefix} + '/' + ${contenido.id}}" class="btn btn-primary" th:text="#{command.modificar}">Modificar</a>
					<a th:href="@{${pageUrlPrefix} + '/delete/' + ${contenido.id}}" class="btn btn-danger" th:text="#{command.borrar}">Borrar</a></td>
				</tr>
			</tbody>
		</table>
	</div>	
</section>
</body>
</html>
