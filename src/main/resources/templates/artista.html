<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	th:replace="~{plantillaDatos::layout(~{::section})}"><head>
<meta charset="utf-8">
<title>Artista</title>
</head>
<body>
<section>
	<div class="container">
		<h1>ARTISTAS</h1>
		<br>
		<h4 ><span th:text="#{usuario.title} + ':'"></span>
			<span sec:authentication="principal.username"></span>
		</h4>
		<div class="form-group">
			<span><a th:href="@{/admin/artista/newartista}" class="btn btn-primary" th:text="#{command.nuevo} + ' ' +  #{actor.title}">Nuevo</a></span>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th th:text="#{registro.nombre}">Nombre</th>
					<th th:text="#{texto.nacionalidad}">Nacionalidad</th>
					<th th:text="#{texto.fnacimiento}">F.Nacimiento</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="artista : ${artistas}">
					<td th:text="${artista.nombre}">ID</td>
					<td th:text="${artista.nacionalidad}">ID</td>
					<td th:text="${artista.fechaNacimiento}">ID</td>
					<td><a th:href="@{/admin/artista/{id}(id=${artista.id})}" class="btn btn-primary" th:text="#{command.modificar}">Modificar</a>
					<a th:href="@{/admin/artista/delete/{id}(id=${artista.id})}" class="btn btn-danger" th:text="#{command.borrar}">Borrar</a></td>
				</tr>
			</tbody>
		</table>
	</div>	
</section>
</body>
</html>
