<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
	th:replace="~{ plantillaDatos :: layout(~{::section}, ~{::title})}"><head>
<meta charset="utf-8">
<title th:text="#{genero.title}">Title</title>
</head>
<body>
<section>
	<div class="container">
		<h1 th:text="#{genero.title}">Detalle</h1>
		<br>
		<div class="form-group">
			<span><a th:href="@{/admin/genero/new}" class="btn btn-primary" th:text="#{command.nuevo} + ' ' +  #{genero.title}">Nuevo</a></span>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th th:text="#{registro.nombre}">Nombre</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="genero : ${generos}">
					<td th:text="${genero.nombre}">ID</td>
					<td><a th:href="@{/admin/genero/{id}(id=${genero.id})}" class="btn btn-primary" th:text="#{command.modificar}">Modificar</a>
					<a th:href="@{/admin/genero/delete/{id}(id=${genero.id})}" class="btn btn-danger" th:text="#{command.borrar}">Borrar</a></td>
					</tr>
			</tbody>
		</table>
	</div>	
</section>
</body>
</html>
